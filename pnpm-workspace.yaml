skills:
  dirs:
    - .claude/skills
    - .agents/skills

permissions:
  '@google/genai':
    build: false
  '@tanstack/ai':
    skills: true
  '@tanstack/ai-code-mode':
    skills: true
  '@tanstack/ai-persistence':
    skills: true
  '@tanstack/devtools-vite':
    skills: true
  '@tanstack/react-db':
    skills: true
  '@tanstack/react-hotkeys':
    skills: true
  '@tanstack/react-router':
    skills: true
  '@tanstack/react-start':
    skills: true
  '@tanstack/react-table':
    skills: true
  lmdb:
    build: true
  msgpackr-extract:
    build: true
  protobufjs:
    build: false

patchedDependencies:
  # A rejoined run drops the assistant message its own REASONING_MESSAGE_START just created (the start carries
  # metadata), so the replayed thinking and every later part land on a message no longer in the list.
  '@tanstack/ai-client@1.0.0': patches/@tanstack__ai-client@1.0.0.patch
  # Drops the `intent` bin that shadows @tanstack/intent's CLI and fails with ERR_PACKAGE_PATH_NOT_EXPORTED.
  # Remove once https://github.com/TanStack/devtools/pull/542 is released
  # (issue: https://github.com/TanStack/devtools/issues/525).
  '@tanstack/devtools-vite': patches/@tanstack__devtools-vite.patch

allowBuilds:
  '@google/genai': set this to true or false
  lmdb: set this to true or false
  msgpackr-extract: set this to true or false
  protobufjs: set this to true or false
